    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <h1>多益題庫</h1>
    
    <!-- 加入獲取最新版本的按鈕 -->
    <button onclick="refreshToLatest()" style="padding: 5px 10px; margin-bottom: 15px; cursor: pointer;">
        🔄 獲取最新版本
    </button>

    <!-- JavaScript 處理強制刷新 -->
    <script>
        function refreshToLatest() {
            // 取得目前的網址，並去掉已有的參數（避免網址越來越長）
            const currentUrl = window.location.href.split('?')[0]; 
            // 加上當下的時間戳記（毫秒），例如：?v=1697854321000
            const newUrl = currentUrl + '?v=' + new Date().getTime();
            // 導向新網址，強制抓取最新畫面
            window.location.href = newUrl;
        }
    </script>
